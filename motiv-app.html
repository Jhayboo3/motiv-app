<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Motiv — Daily Motivation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #FF5C00; --yellow: #FFD600; --dark: #0E0E0E;
      --surface: #1A1A1A; --surface2: #232323; --border: rgba(255,255,255,0.08);
      --text: #F5F5F0; --muted: #888;
      --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    html, body { height: 100%; }
    body { font-family: var(--font-body); background: var(--dark); color: var(--text); min-height: 100vh; }

    /* NAV */
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--dark); position: sticky; top: 0; z-index: 10; }
    .nav-logo { font-family: var(--font-head); font-weight: 800; font-size: 20px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; color: var(--text); }
    .logo-dot { width: 10px; height: 10px; background: var(--orange); border-radius: 50%; display: inline-block; }
    .nav-tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 10px; padding: 4px; }
    .nav-tab { font-family: var(--font-body); font-size: 13px; font-weight: 500; padding: 7px 16px; border-radius: 7px; border: none; cursor: pointer; color: var(--muted); background: transparent; transition: all 0.2s; }
    .nav-tab.active { background: var(--orange); color: #fff; }
    .nav-date { font-size: 13px; color: var(--muted); }

    /* PAGES */
    .page { display: none; padding: 28px; }
    .page.active { display: block; }

    /* QUOTE HERO */
    .quote-hero { border-radius: 24px; margin-bottom: 20px; position: relative; overflow: hidden; min-height: 360px; display: flex; flex-direction: column; justify-content: flex-end; }
    .nature-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 55%, rgba(0,0,0,0.08) 100%); }
    .hero-content { position: relative; z-index: 2; padding: 36px 40px; }
    .quote-hero-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .quote-tag { font-size: 11px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.85); font-family: var(--font-head); }
    .quote-date-badge { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); border-radius: 100px; padding: 5px 14px; font-size: 12px; font-weight: 500; color: #fff; font-family: var(--font-body); }
    .quote-text { font-family: var(--font-head); font-weight: 700; font-style: italic; font-size: clamp(20px, 2.8vw, 30px); line-height: 1.35; color: #fff; margin-bottom: 14px; max-width: 620px; text-shadow: 0 2px 14px rgba(0,0,0,0.5); }
    .quote-author { font-size: 15px; color: rgba(255,255,255,0.75); font-weight: 500; margin-bottom: 26px; }
    .quote-actions { display: flex; gap: 10px; }
    .btn-save { background: rgba(255,255,255,0.18); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 10px; padding: 11px 24px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font-body); transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
    .btn-save:hover { background: rgba(255,255,255,0.3); }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

    /* DASHBOARD */
    .dash-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .dash-greeting { font-family: var(--font-head); font-size: 28px; font-weight: 800; line-height: 1.1; }
    .dash-greeting span { color: var(--orange); }
    .dash-streak { display: flex; align-items: center; gap: 8px; background: rgba(255,214,0,0.1); border: 1px solid rgba(255,214,0,0.2); padding: 8px 16px; border-radius: 100px; font-size: 13px; font-weight: 500; color: var(--yellow); }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    @media(max-width: 480px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 18px; }
    .stat-card.accent { background: var(--orange); border-color: var(--orange); }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
    .stat-card.accent .stat-label { color: rgba(255,255,255,0.7); }
    .stat-value { font-family: var(--font-head); font-size: 32px; font-weight: 800; line-height: 1; color: var(--text); }
    .stat-card.accent .stat-value { color: #fff; }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .stat-card.accent .stat-sub { color: rgba(255,255,255,0.7); }
    .progress-section { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    @media(max-width: 600px) { .progress-section { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }
    .panel-title { font-family: var(--font-head); font-size: 14px; font-weight: 700; margin-bottom: 18px; color: var(--text); }
    .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 100px; margin-bottom: 8px; }
    .bar-col { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 6px; }
    .bar { width: 100%; border-radius: 6px 6px 0 0; background: var(--surface2); min-height: 4px; }
    .bar.filled { background: var(--orange); }
    .bar.today { background: var(--yellow); }
    .bar-day { font-size: 10px; color: var(--muted); }
    .goal-item { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .goal-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .goal-check.done { background: var(--orange); border-color: var(--orange); }
    .goal-check.done::after { content: ''; width: 8px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px); display: block; }
    .goal-info { flex: 1; min-width: 0; }
    .goal-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .goal-name.done { color: var(--muted); text-decoration: line-through; }
    .goal-prog { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .goal-bar-wrap { height: 4px; background: var(--surface2); border-radius: 100px; margin-top: 5px; overflow: hidden; }
    .goal-bar-fill { height: 100%; background: var(--orange); border-radius: 100px; transition: width 0.4s ease; }
    .add-btn { width: 100%; padding: 12px; background: transparent; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); font-size: 13px; cursor: pointer; font-family: var(--font-body); transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .add-btn:hover { border-color: var(--orange); color: var(--orange); background: rgba(255,92,0,0.05); }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px; width: 360px; max-width: 92vw; }
    .modal-title { font-family: var(--font-head); font-size: 18px; font-weight: 700; margin-bottom: 20px; color: var(--text); }
    .modal input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 13px; font-family: var(--font-body); margin-bottom: 10px; outline: none; }
    .modal input:focus { border-color: var(--orange); }
    .modal-actions { display: flex; gap: 8px; margin-top: 6px; }
    .btn-confirm { flex: 1; background: var(--orange); color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font-body); }
    .btn-cancel { flex: 1; background: var(--surface2); color: var(--muted); border: none; border-radius: 10px; padding: 11px; font-size: 13px; cursor: pointer; font-family: var(--font-body); }
  </style>
</head>
<body>

<div id="app">
  <nav class="nav">
    <div class="nav-logo"><span class="logo-dot"></span>Motiv</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showPage('quotes')">Quotes</button>
      <button class="nav-tab" onclick="showPage('dashboard')">Dashboard</button>
    </div>
    <div class="nav-date" id="nav-date"></div>
  </nav>

  <!-- QUOTES PAGE -->
  <div class="page active" id="page-quotes">
    <div class="quote-hero" id="quote-hero-card">
      <svg class="nature-bg" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a2a1a"/><stop offset="40%" stop-color="#1a5c30"/><stop offset="100%" stop-color="#2d7a45"/></linearGradient>
          <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe066"/><stop offset="100%" stop-color="#ffb300"/></linearGradient>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff8c0" stop-opacity="0.35"/><stop offset="100%" stop-color="#fff8c0" stop-opacity="0"/></radialGradient>
          <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a3d28"/><stop offset="100%" stop-color="#0d2218"/></linearGradient>
          <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a5c38"/><stop offset="100%" stop-color="#163320"/></linearGradient>
          <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e4d2b"/><stop offset="100%" stop-color="#0e2a18"/></linearGradient>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a4a6b"/><stop offset="100%" stop-color="#0d2e42"/></linearGradient>
        </defs>
        <rect width="800" height="400" fill="url(#sky)"/>
        <ellipse cx="400" cy="145" rx="90" ry="90" fill="url(#glow)"/>
        <circle cx="400" cy="148" r="34" fill="url(#sun)" opacity="0.95"/>
        <g opacity="0.4" stroke="#ffe066" stroke-width="1.5" stroke-linecap="round">
          <line x1="400" y1="100" x2="400" y2="88"/><line x1="400" y1="196" x2="400" y2="208"/>
          <line x1="352" y1="148" x2="340" y2="148"/><line x1="448" y1="148" x2="460" y2="148"/>
          <line x1="366" y1="114" x2="358" y2="106"/><line x1="434" y1="182" x2="442" y2="190"/>
          <line x1="434" y1="114" x2="442" y2="106"/><line x1="366" y1="182" x2="358" y2="190"/>
        </g>
        <g fill="#fff" opacity="0.5">
          <circle cx="120" cy="40" r="1.2"/><circle cx="200" cy="25" r="0.9"/>
          <circle cx="600" cy="35" r="1.1"/><circle cx="680" cy="55" r="0.8"/>
          <circle cx="750" cy="30" r="1"/><circle cx="60" cy="70" r="0.7"/>
        </g>
        <g fill="none" stroke="#fff" stroke-width="1" opacity="0.55" stroke-linecap="round">
          <path d="M160 80 Q165 76 170 80"/><path d="M172 78 Q177 74 182 78"/>
          <path d="M620 65 Q626 60 632 65"/><path d="M636 62 Q641 57 646 62"/>
        </g>
        <polygon points="0,260 80,160 160,220 240,140 320,200 400,120 480,195 560,145 640,210 720,155 800,220 800,400 0,400" fill="url(#mtn1)" opacity="0.85"/>
        <polygon points="0,310 100,210 200,270 300,185 420,255 520,190 620,250 720,200 800,255 800,400 0,400" fill="url(#mtn2)"/>
        <ellipse cx="400" cy="360" rx="200" ry="22" fill="url(#water)" opacity="0.7"/>
        <g stroke="#7bbfd4" stroke-width="0.8" opacity="0.3">
          <line x1="310" y1="355" x2="370" y2="355"/><line x1="420" y1="362" x2="490" y2="362"/><line x1="330" y1="368" x2="400" y2="368"/>
        </g>
        <rect x="0" y="355" width="800" height="45" fill="url(#ground)"/>
        <g><rect x="58" y="280" width="7" height="55" fill="#1a2e1e"/><polygon points="62,210 38,295 86,295" fill="#1e4028"/><polygon points="62,230 40,305 84,305" fill="#234a2e"/><polygon points="62,250 42,315 82,315" fill="#2a5535"/></g>
        <g><rect x="118" y="295" width="6" height="45" fill="#1a2e1e"/><polygon points="121,235 101,300 141,300" fill="#1e4028"/><polygon points="121,255 103,310 139,310" fill="#234a2e"/><polygon points="121,270 105,322 137,322" fill="#2a5535"/></g>
        <g><rect x="728" y="278" width="7" height="57" fill="#1a2e1e"/><polygon points="732,205 708,290 756,290" fill="#1e4028"/><polygon points="732,228 710,300 754,300" fill="#234a2e"/><polygon points="732,248 712,312 752,312" fill="#2a5535"/></g>
        <g><rect x="672" y="292" width="6" height="48" fill="#1a2e1e"/><polygon points="675,232 655,298 695,298" fill="#1e4028"/><polygon points="675,252 657,308 693,308" fill="#234a2e"/><polygon points="675,268 659,320 691,320" fill="#2a5535"/></g>
        <g><rect x="300" y="328" width="5" height="28" fill="#1a2e1e"/><polygon points="303,300 288,335 318,335" fill="#2a5535"/><polygon points="303,314 289,342 317,342" fill="#2d5e38"/></g>
        <g><rect x="490" y="330" width="5" height="26" fill="#1a2e1e"/><polygon points="493,303 478,336 508,336" fill="#2a5535"/><polygon points="493,317 479,343 507,343" fill="#2d5e38"/></g>
        <g stroke="#2d6e3a" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
          <line x1="20" y1="380" x2="18" y2="365"/><line x1="25" y1="380" x2="27" y2="364"/>
          <line x1="760" y1="378" x2="758" y2="363"/><line x1="765" y1="378" x2="767" y2="362"/>
          <line x1="200" y1="382" x2="198" y2="370"/><line x1="205" y1="382" x2="207" y2="369"/>
          <line x1="590" y1="381" x2="588" y2="369"/><line x1="595" y1="381" x2="597" y2="368"/>
        </g>
        <rect x="0" y="295" width="800" height="35" fill="white" opacity="0.04"/>
      </svg>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="quote-hero-top">
          <div class="quote-tag">Quote of the Day</div>
          <div class="quote-date-badge" id="hero-date"></div>
        </div>
        <div class="quote-text" id="hero-text"></div>
        <div class="quote-author" id="hero-author"></div>
        <div class="quote-actions">
          <button class="btn-save" id="save-btn" onclick="downloadQuoteImage()">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1v9M5 7l3 3 3-3M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Save as image
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- DASHBOARD PAGE -->
  <div class="page" id="page-dashboard">
    <div class="dash-header">
      <div class="dash-greeting">Keep<br>pushing, <span>champ.</span></div>
      <div class="dash-streak">🔥 <span id="streak-count">7</span> day streak</div>
    </div>
    <div class="stats-grid">
      <div class="stat-card accent"><div class="stat-label">Goals Done</div><div class="stat-value" id="goals-done">0</div><div class="stat-sub">this week</div></div>
      <div class="stat-card"><div class="stat-label">Active Goals</div><div class="stat-value" id="goals-active">0</div><div class="stat-sub">in progress</div></div>
      <div class="stat-card"><div class="stat-label">Completion</div><div class="stat-value" id="goals-pct">0%</div><div class="stat-sub">overall</div></div>
    </div>
    <div class="progress-section">
      <div class="panel">
        <div class="panel-title">Weekly Activity</div>
        <div class="bar-chart" id="bar-chart"></div>
        <div class="bar-chart" id="bar-days" style="height:auto; margin-top:-4px;"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Today's Goals</div>
        <div id="goal-items"></div>
        <button class="add-btn" onclick="openModal()">+ Add goal</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">New Goal</div>
    <input type="text" id="goal-input" placeholder="e.g. Finish 3 chapters" maxlength="60"/>
    <input type="number" id="goal-target" placeholder="Target steps (e.g. 10)" min="1" max="999"/>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" onclick="addGoal()">Add Goal</button>
    </div>
  </div>
</div>

<script>
  const quotes = [
    { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
    { text: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
    { text: "Success is not final; failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
    { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
    { text: "Act as if what you do makes a difference. It does.", author: "William James" },
    { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
    { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
    { text: "Energy and persistence conquer all things.", author: "Benjamin Franklin" },
    { text: "Push yourself, because no one else is going to do it for you.", author: "Anonymous" },
    { text: "Dream big and dare to fail.", author: "Norman Vaughan" },
    { text: "Little by little, one travels far.", author: "J.R.R. Tolkien" },
    { text: "Discipline is the bridge between goals and accomplishment.", author: "Jim Rohn" },
  ];

  function getDayOfYear(d) {
    return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  }

  const today = new Date();
  const todayQuote = quotes[getDayOfYear(today) % quotes.length];

  document.getElementById('hero-text').textContent = todayQuote.text;
  document.getElementById('hero-author').textContent = '— ' + todayQuote.author;
  document.getElementById('hero-date').textContent = today.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('nav-date').textContent = today.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

  async function downloadQuoteImage() {
    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" stroke="#fff" stroke-width="1.5" stroke-dasharray="20" stroke-dashoffset="10"><animateTransform attributeName="transform" type="rotate" from="0 8 8" to="360 8 8" dur="0.8s" repeatCount="indefinite"/></circle></svg> Generating…';
    try {
      const card = document.getElementById('quote-hero-card');
      btn.style.display = 'none';
      const canvas = await html2canvas(card, { scale: 2, useCORS: true, allowTaint: true, backgroundColor: null, logging: false });
      btn.style.display = 'flex';
      const size = Math.min(canvas.width, canvas.height);
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = size;
      exportCanvas.height = size;
      const ctx = exportCanvas.getContext('2d');
      ctx.drawImage(canvas, (canvas.width - size) / 2, (canvas.height - size) / 2, size, size, 0, 0, size, size);
      const link = document.createElement('a');
      link.download = 'motiv-quote-' + today.toISOString().slice(0, 10) + '.png';
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
      btn.disabled = false;
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8l4 4 6-6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Saved!';
      setTimeout(() => { btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1v9M5 7l3 3 3-3M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Save as image'; }, 2500);
    } catch (e) {
      btn.style.display = 'flex';
      btn.disabled = false;
      btn.innerHTML = 'Try again';
      setTimeout(() => { btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1v9M5 7l3 3 3-3M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Save as image'; }, 2000);
    }
  }

  function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    const tabs = document.querySelectorAll('.nav-tab');
    tabs[page === 'quotes' ? 0 : 1].classList.add('active');
    if (page === 'dashboard') renderDashboard();
  }

  let goals = [
    { name: 'Study 2 hours', done: false, progress: 60 },
    { name: 'Read 30 pages', done: false, progress: 40 },
  ];
  const weekData = [4, 6, 3, 7, 5, 8, 0];
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const todayIdx = today.getDay() === 0 ? 6 : today.getDay() - 1;

  function renderDashboard() {
    const done = goals.filter(g => g.done).length;
    document.getElementById('goals-done').textContent = done;
    document.getElementById('goals-active').textContent = goals.filter(g => !g.done).length;
    document.getElementById('goals-pct').textContent = goals.length ? Math.round(done / goals.length * 100) + '%' : '0%';
    const maxVal = Math.max(...weekData, 1);
    document.getElementById('bar-chart').innerHTML = weekData.map((v, i) => {
      const h = Math.round((v / maxVal) * 90);
      const cls = 'bar' + (i < todayIdx ? ' filled' : '') + (i === todayIdx ? ' today' : '');
      return `<div class="bar-col"><div class="${cls}" style="height:${h}px"></div></div>`;
    }).join('');
    document.getElementById('bar-days').innerHTML = days.map((d, i) =>
      `<div class="bar-col"><span class="bar-day" style="color:${i === todayIdx ? '#FFD600' : ''}">${d}</span></div>`
    ).join('');
    document.getElementById('goal-items').innerHTML = goals.map((g, i) => `
      <div class="goal-item">
        <div class="goal-check ${g.done ? 'done' : ''}" onclick="toggleGoal(${i})"></div>
        <div class="goal-info">
          <div class="goal-name ${g.done ? 'done' : ''}">${g.name}</div>
          <div class="goal-bar-wrap"><div class="goal-bar-fill" style="width:${g.done ? 100 : g.progress}%"></div></div>
          <div class="goal-prog">${g.done ? 'Completed' : g.progress + '% done'}</div>
        </div>
      </div>`).join('');
  }

  function toggleGoal(i) {
    goals[i].done = !goals[i].done;
    if (goals[i].done) goals[i].progress = 100;
    renderDashboard();
  }

  function openModal() { document.getElementById('modal').classList.add('show'); document.getElementById('goal-input').focus(); }
  function closeModal() { document.getElementById('modal').classList.remove('show'); document.getElementById('goal-input').value = ''; document.getElementById('goal-target').value = ''; }
  function addGoal() {
    const name = document.getElementById('goal-input').value.trim();
    if (!name) return;
    goals.push({ name, done: false, progress: 0 });
    closeModal();
    renderDashboard();
  }

  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>
</body>
</html>
