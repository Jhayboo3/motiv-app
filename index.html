<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Motiv — Daily Inspiration</title>

  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src  'self' 'unsafe-inline' 'unsafe-eval'
                  https://cdn.jsdelivr.net
                  https://cdn.tailwindcss.com
                  https://cdnjs.cloudflare.com
                  https://*.clerk.accounts.dev
                  https://clerk.com
                  https://*.clerk.com;
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    https://fonts.gstatic.com;
      img-src     'self' data: blob: https://images.unsplash.com https://*.clerk.com https://img.clerk.com;
      connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.com https://clerk.com
                  https://api.quotable.io https://zenquotes.io https://type.fit;
      frame-src   https://*.clerk.accounts.dev https://*.clerk.com;
    ">

  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_ZGlzY3JldGUtbW9vc2UtNTUuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:   #FF5C00;
      --solar:   #FFD600;
      --dark:    #0E0E0E;
      --surface: #1A1A1A;
      --text:    #f3f4f6;
      --muted:   #9ca3af;
      --border:  rgba(255,255,255,0.08);
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    nav {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem;
      background: rgba(14,14,14,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 1.2rem;
      display: flex; align-items: center; gap: 0.5rem;
    }

    .pulse-dot {
      width: 10px; height: 10px;
      background: var(--brand); border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(1.3); }
    }

    .nav-right { display: flex; align-items: center; gap: 1rem; }

    .tab-group {
      display: flex; background: var(--surface);
      padding: 4px; border-radius: 14px; gap: 2px;
    }
    .tab-btn {
      padding: 8px 20px; font-size: 0.85rem; font-weight: 600;
      border-radius: 10px; border: none; cursor: pointer;
      transition: all 0.2s; font-family: 'DM Sans', sans-serif;
      background: transparent; color: var(--muted);
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active {
      background: var(--brand); color: #fff;
      box-shadow: 0 4px 14px rgba(255,92,0,0.4);
    }

    .user-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,92,0,0.12);
      border: 1px solid rgba(255,92,0,0.25);
      border-radius: 10px; padding: 6px 12px;
    }
    .user-avatar-sm {
      width: 22px; height: 22px; border-radius: 50%;
      object-fit: cover; border: 1px solid var(--brand);
    }
    .user-pill-name {
      font-size: 0.78rem; font-weight: 700;
      color: var(--brand); max-width: 80px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .btn-signout-tasks {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; width: 100%; margin-top: 0.75rem;
      padding: 12px; border-radius: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted); font-weight: 600; font-size: 0.85rem;
      cursor: pointer; transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-signout-tasks:hover {
      border-color: rgba(255,92,0,0.3);
      color: var(--brand);
      background: rgba(255,92,0,0.05);
    }

    #auth-gate {
      display: none;
      flex-direction: column; align-items: center;
      justify-content: center; min-height: 80vh;
      text-align: center; padding: 2rem;
    }
    #auth-gate.visible { display: flex; }

    .gate-logo {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 3rem; color: var(--brand);
      margin-bottom: 0.5rem;
      text-shadow: 0 0 40px rgba(255,92,0,0.4);
    }
    .gate-tagline {
      color: var(--muted); font-size: 1rem;
      margin-bottom: 2.5rem; max-width: 300px; line-height: 1.6;
    }
    .gate-btns { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; max-width: 280px; }

    .gate-btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 20px; border-radius: 16px;
      background: #fff; color: #1a1a1a;
      font-weight: 700; font-size: 0.9rem;
      border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .gate-btn-google:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }

    .gate-btn-email {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 20px; border-radius: 16px;
      background: var(--brand); color: #fff;
      font-weight: 700; font-size: 0.9rem;
      border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 20px rgba(255,92,0,0.35);
      transition: transform 0.15s, opacity 0.15s;
    }
    .gate-btn-email:hover { transform: translateY(-2px); opacity: 0.9; }

    .gate-divider {
      color: var(--muted); font-size: 0.75rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .gate-divider::before, .gate-divider::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(255,255,255,0.08);
    }

    main { padding: 1rem; max-width: 680px; margin: 0 auto; }

    .page        { display: none; }
    .page.active { display: block; }

    /* ── QUOTE CARD ── */
    #quote-hero-card {
      position: relative; border-radius: 36px;
      overflow: hidden; background: #000;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      aspect-ratio: 9 / 16; width: 100%;
      -webkit-font-smoothing: antialiased;
    }

    #dynamic-bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
      transition: opacity 0.6s ease;
    }

    .card-overlay {
      position: absolute; inset: 0;
      background: radial-gradient(circle,
        rgba(0,0,0,0.1) 0%,
        rgba(0,0,0,0.4) 50%,
        rgba(0,0,0,0.82) 100%);
    }

    .card-brand-tag {
      position: absolute; top: 2rem; right: 2rem; z-index: 20;
      font-family: 'Syne', sans-serif; font-size: 11px;
      letter-spacing: 0.35em; text-transform: uppercase;
      color: #fff; font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    /* "Today's Quote" locked badge */
    .quote-locked-badge {
      position: absolute; top: 2rem; left: 2rem; z-index: 20;
      background: rgba(255,214,0,0.12);
      border: 1px solid rgba(255,214,0,0.28);
      color: var(--solar); font-size: 10px; font-weight: 700;
      padding: 5px 12px; border-radius: 999px;
      letter-spacing: 0.08em; text-transform: uppercase;
      display: none;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    .quote-locked-badge.show { display: block; }

    .card-content {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2.5rem; text-align: center;
    }

    .card-eyebrow {
      font-family: 'Syne', sans-serif; font-size: 10px;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(255,255,255,0.85); font-weight: 700;
      margin-bottom: 1.4rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    #hero-text {
      font-family: 'Syne', sans-serif; font-style: italic;
      color: #fff; line-height: 1.25; font-weight: 700;
      font-size: clamp(22px, 6.5vw, 36px);
      text-shadow: 0 4px 24px rgba(0,0,0,0.8);
      margin-bottom: 1.5rem; min-height: 120px;
      transition: opacity 0.4s ease;
    }
    #hero-text.loading {
      animation: shimmer 1.2s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%,100% { opacity: 0.25; }
      50%      { opacity: 0.55; }
    }

    .card-author-wrap {
      display: flex; flex-direction: column;
      align-items: center; margin-bottom: 2rem;
    }
    #hero-author {
      font-weight: 700; color: #fff; font-size: 17px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9); margin-bottom: 4px;
    }
    #hero-year {
      font-weight: 700; color: var(--solar); font-size: 13px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }
    #hero-date {
      background: var(--solar); color: #000; font-weight: 700;
      border-radius: 999px; padding: 0 1.2rem; height: 32px;
      font-size: 11px; display: inline-flex;
      align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* Tiny API credit */
    .quote-source {
      position: absolute; bottom: 7.5rem; left: 0; right: 0;
      z-index: 20; text-align: center;
      font-size: 9px; color: rgba(255,255,255,0.28);
      letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
    }

    .card-actions {
      position: absolute; bottom: 2rem; left: 0; right: 0;
      z-index: 20; padding: 0 2rem; display: flex; gap: 0.75rem;
    }

    .btn-save {
      flex: 1; display: flex; align-items: center;
      justify-content: center; gap: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 14px 0; border-radius: 18px;
      font-weight: 700; font-size: 13px; cursor: pointer;
      backdrop-filter: blur(8px); transition: background 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-save:hover  { background: rgba(255,255,255,0.2); }
    .btn-save:disabled { opacity: 0.6; cursor: default; }

    .btn-refresh {
      padding: 14px; border-radius: 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff; cursor: pointer;
      backdrop-filter: blur(8px); transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-refresh:hover { background: rgba(255,255,255,0.1); }
    .btn-refresh.locked { opacity: 0.3; cursor: not-allowed; }
    .btn-refresh.spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ── DASHBOARD ── */
    #page-dashboard { padding-top: 1.5rem; }

    .dash-header {
      display: flex; flex-wrap: wrap;
      justify-content: space-between; align-items: flex-end;
      gap: 1rem; margin-bottom: 1.5rem;
    }

    .dash-title {
      font-family: 'Syne', sans-serif;
      font-size: 2.4rem; font-weight: 800; line-height: 1.1;
    }
    .dash-title .accent { color: var(--brand); }

    .streak-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }

    .streak-badge {
      background: rgba(255,214,0,0.1);
      border: 1px solid rgba(255,214,0,0.25);
      color: var(--solar); font-weight: 700;
      font-size: 0.85rem; padding: 6px 16px; border-radius: 999px;
    }

    .claim-btn {
      background: var(--brand); color: #fff;
      border: none; border-radius: 12px;
      padding: 8px 18px; font-size: 0.8rem;
      font-weight: 700; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 14px rgba(255,92,0,0.4);
      transition: transform 0.15s, opacity 0.15s;
    }
    .claim-btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .claim-btn:disabled {
      background: rgba(255,255,255,0.08); color: var(--muted);
      box-shadow: none; cursor: default; transform: none; opacity: 1;
    }

    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1rem; margin-bottom: 1.5rem;
    }
    @media (min-width: 540px) {
      .stats-grid { grid-template-columns: 1fr 1fr 1fr; }
      .stat-wide  { grid-column: auto; }
    }

    .stat-card { padding: 1.5rem; border-radius: 24px; }
    .stat-card.orange { background: var(--brand); color: #fff; box-shadow: 0 8px 24px rgba(255,92,0,0.35); }
    .stat-card.dark   { background: var(--surface); border: 1px solid rgba(255,255,255,0.06); }
    .stat-wide { grid-column: span 2; }
    @media (min-width: 540px) { .stat-wide { grid-column: span 1; } }

    .stat-label {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.12em; font-weight: 700; margin-bottom: 0.5rem; color: var(--muted);
    }
    .stat-card.orange .stat-label { color: rgba(255,255,255,0.75); }

    .stat-value {
      font-family: 'Syne', sans-serif; font-size: 2.4rem; font-weight: 800; line-height: 1; color: var(--text);
    }
    .stat-value.yellow { color: var(--solar); }

    .panels-grid { display: grid; gap: 1.5rem; }
    @media (min-width: 540px) { .panels-grid { grid-template-columns: 1fr 1fr; } }

    .panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px; padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .panel-title {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.12em; color: #6b7280; font-weight: 700; margin-bottom: 1.5rem;
    }

    #bar-chart { display: flex; align-items: flex-end; gap: 0.5rem; height: 8rem; margin-bottom: 1rem; }
    .bar-col { flex: 1; background: rgba(255,255,255,0.05); border-radius: 6px 6px 0 0; position: relative; height: 100%; }
    .bar-fill { position: absolute; bottom: 0; width: 100%; background: var(--solar); border-radius: 4px 4px 0 0; }
    #bar-days { display: flex; justify-content: space-between; padding: 0 2px; }
    .bar-day  { font-size: 10px; font-weight: 700; color: #6b7280; flex: 1; text-align: center; }

    .goal-item {
      display: flex; align-items: center; gap: 1rem;
      background: var(--dark); padding: 1rem;
      border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 0.75rem; transition: border-color 0.2s;
    }
    .goal-item:hover { border-color: rgba(255,255,255,0.1); }

    .goal-check {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s;
    }
    .goal-check.checked { background: var(--brand); border-color: var(--brand); }

    .goal-info { flex: 1; min-width: 0; }
    .goal-name {
      font-size: 0.875rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 6px; color: var(--text);
    }
    .goal-name.done { text-decoration: line-through; color: #6b7280; }
    .progress-track { width: 100%; background: rgba(255,255,255,0.08); height: 4px; border-radius: 999px; overflow: hidden; }
    .progress-fill  { height: 100%; background: var(--brand); border-radius: 999px; transition: width 0.4s ease; }

    .btn-add {
      width: 100%; padding: 14px;
      border: 2px dashed rgba(255,255,255,0.1);
      border-radius: 16px; color: #6b7280;
      font-weight: 700; background: rgba(255,255,255,0.03);
      cursor: pointer; transition: all 0.2s;
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
    }
    .btn-add:hover { border-color: var(--brand); color: var(--brand); }

    #modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
      z-index: 100; display: none;
      align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }

    .modal-box {
      background: var(--surface); border: 1px solid rgba(255,255,255,0.1);
      width: 100%; max-width: 360px; border-radius: 28px; padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
    .modal-title { font-family: 'Syne', sans-serif; font-size: 1.3rem; color: #fff; margin-bottom: 1.5rem; }
    .modal-input {
      width: 100%; background: var(--dark);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px; margin-bottom: 1.5rem;
      outline: none; color: #fff; font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; transition: border-color 0.2s;
    }
    .modal-input:focus { border-color: var(--brand); }
    .modal-actions { display: flex; gap: 0.75rem; }
    .btn-cancel {
      flex: 1; padding: 12px; background: transparent; color: var(--muted);
      font-weight: 600; cursor: pointer; border: none;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
      transition: color 0.2s; border-radius: 12px;
    }
    .btn-cancel:hover { color: #fff; }
    .btn-confirm {
      flex: 1; padding: 12px; background: var(--brand); color: #fff;
      font-weight: 700; cursor: pointer; border: none; border-radius: 12px;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
      box-shadow: 0 4px 14px rgba(255,92,0,0.4); transition: opacity 0.2s;
    }
    .btn-confirm:hover { opacity: 0.85; }

    .special-day-badge {
      background: linear-gradient(135deg, var(--brand), #ff8c00);
      color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 10px;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 1rem; display: inline-block; animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-logo">
      <div class="pulse-dot"></div>
      Motiv
    </div>
    <div class="nav-right">
      <div class="tab-group">
        <button onclick="showPage('quotes')"    id="tab-quotes"    class="tab-btn active">Quotes</button>
        <button onclick="showPage('dashboard')" id="tab-dashboard" class="tab-btn">Dashboard</button>
        <button onclick="openSignIn()" id="nav-signin-btn" class="tab-btn" style="display:none; color:#FF5C00; font-weight:700;">Sign In</button>
        <div id="nav-auth-area"></div>
      </div>
    </div>
  </nav>

  <div id="auth-gate">
    <div class="gate-logo">Motiv</div>
    <p class="gate-tagline">Your daily dose of inspiration and goal tracking. Sign in to get started.</p>
    <div class="gate-btns">
      <button class="gate-btn-google" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
      <div class="gate-divider">or</div>
      <button class="gate-btn-email" onclick="signInWithEmail()">
        ✉️ &nbsp;Sign in with Email
      </button>
    </div>
  </div>

  <main id="app-main">

    <!-- QUOTES PAGE -->
    <div id="page-quotes" class="page active">
      <div id="quote-hero-card">
        <img id="dynamic-bg" crossorigin="anonymous" src="" alt="Daily Motivation">
        <div class="card-overlay"></div>
        <div class="card-brand-tag">Motiv</div>

        <!-- Shows once quote is locked for the day -->
        <div class="quote-locked-badge" id="quote-locked-badge">📅 Today's Quote</div>

        <div class="card-content">
          <span class="card-eyebrow">Daily Wisdom</span>
          <div id="special-day-badge" class="special-day-badge" style="display:none;"></div>
          <p id="hero-text" class="loading">Fetching today's wisdom...</p>
          <div class="card-author-wrap">
            <p id="hero-author">— Loading</p>
            <p id="hero-year"></p>
          </div>
          <div id="hero-date"></div>
        </div>

        <div class="quote-source" id="quote-source"></div>

        <div class="card-actions" data-html2canvas-ignore="true">
          <button onclick="downloadQuoteImage()" id="save-btn" class="btn-save">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            Save Quote
          </button>
          <button onclick="tryRefreshQuote()" id="refresh-btn" class="btn-refresh" title="New quote tomorrow">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- DASHBOARD PAGE -->
    <div id="page-dashboard" class="page">
      <div class="dash-header">
        <h2 class="dash-title" id="dash-greeting">Keep<br>pushing, <span class="accent">champ.</span></h2>
        <div class="streak-right">
          <div class="streak-badge" id="streak-badge">🔥 0 day streak</div>
          <button onclick="claimStreak()" id="claim-btn" class="claim-btn">⚡ Claim Today</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card orange"><div class="stat-label">Goals Done</div><div id="goals-done" class="stat-value">0</div></div>
        <div class="stat-card dark"><div class="stat-label">Active</div><div id="goals-active" class="stat-value">0</div></div>
        <div class="stat-card dark stat-wide"><div class="stat-label">Completion</div><div id="goals-pct" class="stat-value yellow">0%</div></div>
      </div>

      <div class="panels-grid">
        <div class="panel">
          <div class="panel-title">Weekly Activity</div>
          <div id="bar-chart"></div>
          <div id="bar-days"></div>
        </div>
        <div class="panel">
          <div class="panel-title">Today's Tasks</div>
          <div id="goal-items"></div>
          <button onclick="openModal()" class="btn-add">+ Add new goal</button>
          <div id="tasks-signout-area"></div>
        </div>
      </div>
    </div>

  </main>

  <div id="modal">
    <div class="modal-box">
      <div class="modal-title">New Goal</div>
      <input type="text" id="goal-input" placeholder="What are we crushing?" class="modal-input">
      <div class="modal-actions">
        <button onclick="closeModal()" class="btn-cancel">Cancel</button>
        <button onclick="addGoal()"    class="btn-confirm">Add Goal</button>
      </div>
    </div>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════
    // DAILY QUOTE SYSTEM
    // - Fetched ONCE per day from free open APIs (no API key)
    // - Stored in localStorage with today's date
    // - Refresh button is locked once the daily quote is saved
    // - Falls back to local pool if all APIs are unreachable
    // ══════════════════════════════════════════════════════════

    const QUOTE_KEY = 'motiv_daily_quote';

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getStoredQuote() {
      try {
        const raw = localStorage.getItem(QUOTE_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        return s.date === todayStr() ? s : null; // stale = null
      } catch { return null; }
    }

    function storeQuote(q) {
      localStorage.setItem(QUOTE_KEY, JSON.stringify({ ...q, date: todayStr() }));
    }

    // ── FREE QUOTE APIS ───────────────────────────────────────
    // 1. quotable.io  (open source, 1500+ curated quotes, no key)
    // 2. type.fit     (public, no key, ~1600 quotes)
    // 3. Local pool   (offline fallback, deterministic by day)

    async function fetchFromQuotable() {
      const special = getSpecialDay();
      if (special) return special; // always use themed quote on holidays

      const res = await fetch(
        'https://api.quotable.io/random?minLength=60&maxLength=200',
        { signal: AbortSignal.timeout(6000) }
      );
      if (!res.ok) throw new Error('quotable.io failed');
      const d = await res.json();
      return { text: d.content, author: d.author, source: 'quotable.io' };
    }

    async function fetchFromTypeFit() {
      const res = await fetch(
        'https://type.fit/api/quotes',
        { signal: AbortSignal.timeout(6000) }
      );
      if (!res.ok) throw new Error('type.fit failed');
      const all  = await res.json();
      // Pick deterministically based on day so it's stable after a page reload
      const idx  = new Date().getDate() % all.length;
      const q    = all[idx];
      return { text: q.text, author: q.author || 'Unknown', source: 'type.fit' };
    }

    async function fetchDailyQuote() {
      for (const fn of [fetchFromQuotable, fetchFromTypeFit]) {
        try {
          const q = await fn();
          if (q?.text?.length > 10) return q;
        } catch (_) { /* try next */ }
      }
      return getLocalFallback(); // all APIs failed
    }

    // ── SPECIAL DAYS ─────────────────────────────────────────
    const SPECIAL_DAYS = {
      '01-01': { key: 'newYear',      name: "New Year's Day" },
      '02-14': { key: 'valentine',    name: "Valentine's Day" },
      '03-08': { key: 'womensDay',    name: "International Women's Day" },
      '04-22': { key: 'earthDay',     name: "Earth Day" },
      '05-01': { key: 'laborDay',     name: "Labor Day" },
      '07-04': { key: 'independence', name: "Independence Day" },
      '10-31': { key: 'halloween',    name: "Halloween" },
      '11-28': { key: 'thanksgiving', name: "Thanksgiving" },
      '12-25': { key: 'christmas',    name: "Christmas Day" }
    };

    const SPECIAL_QUOTES = {
      newYear:      [{ text:"New year, new beginnings. Make this year your masterpiece.", author:"Motiv" }, { text:"Cheers to a new year and another chance for us to get it right.", author:"Oprah Winfrey" }],
      valentine:    [{ text:"The best thing to hold onto in life is each other.", author:"Audrey Hepburn" }, { text:"Where there is love there is life.", author:"Mahatma Gandhi" }],
      womensDay:    [{ text:"There is no limit to what we, as women, can accomplish.", author:"Michelle Obama" }, { text:"A woman with a voice is, by definition, a strong woman.", author:"Melinda Gates" }],
      earthDay:     [{ text:"The Earth is what we all have in common.", author:"Wendell Berry" }, { text:"Nature does not hurry, yet everything is accomplished.", author:"Lao Tzu" }],
      laborDay:     [{ text:"Nothing will work unless you do.", author:"Maya Angelou" }, { text:"Hard work beats talent when talent doesn't work hard.", author:"Tim Notke" }],
      independence: [{ text:"Freedom is never given; it is won.", author:"A. Philip Randolph" }, { text:"Liberty is the breath of life to nations.", author:"George Bernard Shaw" }],
      halloween:    [{ text:"The only thing we have to fear is fear itself.", author:"Franklin D. Roosevelt" }, { text:"Courage is resistance to fear — not absence of fear.", author:"Mark Twain" }],
      thanksgiving: [{ text:"Gratitude turns what we have into enough.", author:"Aesop" }, { text:"Thanksgiving is a time of togetherness and gratitude.", author:"Nigel Hamilton" }],
      christmas:    [{ text:"Peace on earth will come to stay, when we live Christmas every day.", author:"Helen Steiner Rice" }]
    };

    function getSpecialDay() {
      const d  = new Date();
      const md = `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const sp = SPECIAL_DAYS[md];
      if (!sp) return null;
      const pool = SPECIAL_QUOTES[sp.key];
      const q    = pool[Math.floor(Math.random() * pool.length)];
      return { text: q.text, author: q.author, source: 'motiv', isSpecial: true, specialDayName: sp.name };
    }

    // ── LOCAL FALLBACK (deterministic by day of year) ─────────
    const LOCAL_POOL = [
      { text:"The only way to do great work is to love what you do.", author:"Steve Jobs" },
      { text:"Believe you can and you're halfway there.", author:"Theodore Roosevelt" },
      { text:"Success is not final, failure is not fatal: it is the courage to continue that counts.", author:"Winston Churchill" },
      { text:"The future belongs to those who believe in the beauty of their dreams.", author:"Eleanor Roosevelt" },
      { text:"It is during our darkest moments that we must focus to see the light.", author:"Aristotle" },
      { text:"The only limit to our realization of tomorrow will be our doubts of today.", author:"Franklin D. Roosevelt" },
      { text:"Whether you think you can or you think you can't, you're right.", author:"Henry Ford" },
      { text:"The best way to predict the future is to create it.", author:"Peter Drucker" },
      { text:"Everything you've ever wanted is on the other side of fear.", author:"George Addair" },
      { text:"Don't watch the clock; do what it does. Keep going.", author:"Sam Levenson" },
      { text:"You are never too old to set another goal or to dream a new dream.", author:"C.S. Lewis" },
      { text:"It does not matter how slowly you go as long as you do not stop.", author:"Confucius" },
      { text:"In the middle of every difficulty lies opportunity.", author:"Albert Einstein" },
      { text:"The secret of getting ahead is getting started.", author:"Mark Twain" },
      { text:"Act as if what you do makes a difference. It does.", author:"William James" }
    ];

    function getLocalFallback() {
      const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
      const q = LOCAL_POOL[dayOfYear % LOCAL_POOL.length];
      return { text: q.text, author: q.author, source: 'local' };
    }

    // ── RENDER QUOTE ──────────────────────────────────────────
    function renderQuoteData(q) {
      const textEl    = document.getElementById('hero-text');
      const authorEl  = document.getElementById('hero-author');
      const yearEl    = document.getElementById('hero-year');
      const badgeEl   = document.getElementById('special-day-badge');
      const srcEl     = document.getElementById('quote-source');
      const lockBadge = document.getElementById('quote-locked-badge');
      const refreshBtn= document.getElementById('refresh-btn');

      textEl.style.opacity = '0';
      textEl.classList.remove('loading');

      setTimeout(() => {
        textEl.textContent   = `"${q.text}"`;
        authorEl.textContent = `— ${q.author}`;
        yearEl.textContent   = new Date().getFullYear();

        badgeEl.style.display = q.isSpecial ? 'inline-block' : 'none';
        if (q.isSpecial) badgeEl.textContent = `✨ ${q.specialDayName}`;

        srcEl.textContent = (q.source && q.source !== 'local' && q.source !== 'motiv')
          ? `via ${q.source}` : '';

        // Lock refresh — quote is set for today
        lockBadge.classList.add('show');
        refreshBtn.classList.add('locked');
        refreshBtn.title = 'New quote available tomorrow';

        textEl.style.opacity = '1';
      }, 220);
    }

    // ── MAIN QUOTE INIT ───────────────────────────────────────
    async function initDailyQuote() {
      const textEl = document.getElementById('hero-text');
      textEl.classList.add('loading');
      textEl.textContent = "Fetching today's wisdom...";

      const stored = getStoredQuote();
      if (stored) {
        // Already have today's quote — show immediately, no fetch needed
        renderQuoteData(stored);
        return;
      }

      // First visit today — fetch fresh quote
      const q = await fetchDailyQuote();
      storeQuote(q);
      renderQuoteData(q);
    }

    // Refresh button handler — blocked once today's quote is stored
    function tryRefreshQuote() {
      if (getStoredQuote()) {
        // Briefly flash a "come back tomorrow" message on the badge
        const badge = document.getElementById('quote-locked-badge');
        const orig  = badge.textContent;
        badge.style.cssText += 'background:rgba(255,92,0,0.2);border-color:rgba(255,92,0,0.45);color:#FF5C00;';
        badge.textContent    = '🔒 New quote tomorrow';
        setTimeout(() => {
          badge.style.cssText = '';
          badge.textContent   = orig;
        }, 2200);
        return;
      }
      // Shouldn't normally reach here, but allow fresh fetch if not yet stored
      initDailyQuote();
    }

    // ── DATA ──────────────────────────────────────────────────
    const bgImages = [
      'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1080&q=80',
      'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1080&q=80',
      'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1080&q=80',
      'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1080&q=80',
      'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1080&q=80'
    ];

    let goals = [
      { name: 'Morning Meditation', done: true,  progress: 100 },
      { name: 'Push-up Challenge',  done: false, progress: 40  }
    ];

    // ── SESSION ───────────────────────────────────────────────
    const SESSION_KEY      = 'motiv_user_session';
    const SESSION_DURATION = 90 * 24 * 60 * 60 * 1000;

    function saveUserSession(u) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        userId: u.id, email: u.emailAddresses[0]?.emailAddress,
        firstName: u.firstName, lastName: u.lastName,
        imageUrl: u.imageUrl, timestamp: Date.now()
      }));
    }
    function getUserSession() {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      try {
        const s = JSON.parse(raw);
        if (Date.now() - s.timestamp < SESSION_DURATION) return s;
        localStorage.removeItem(SESSION_KEY); return null;
      } catch { localStorage.removeItem(SESSION_KEY); return null; }
    }
    function clearUserSession() { localStorage.removeItem(SESSION_KEY); }

    // ── STREAK ────────────────────────────────────────────────
    function getStreakKey() {
      const u = Clerk.user, s = getUserSession();
      return `motiv_streak_${u?.id || s?.userId || 'anonymous'}`;
    }
    function getStreakData() {
      const raw = localStorage.getItem(getStreakKey());
      if (!raw) return { count: 0, lastClaimed: null, history: [] };
      try { return JSON.parse(raw); } catch { return { count: 0, lastClaimed: null, history: [] }; }
    }
    function saveStreakData(d) { localStorage.setItem(getStreakKey(), JSON.stringify(d)); }

    function isSameDay(ds) {
      if (!ds) return false;
      const l = new Date(ds), n = new Date();
      return l.getFullYear()===n.getFullYear() && l.getMonth()===n.getMonth() && l.getDate()===n.getDate();
    }
    function isYesterday(ds) {
      if (!ds) return false;
      const l = new Date(ds), y = new Date(); y.setDate(y.getDate()-1);
      return l.getFullYear()===y.getFullYear() && l.getMonth()===y.getMonth() && l.getDate()===y.getDate();
    }
    function getDaysDiff(ds) {
      if (!ds) return Infinity;
      return Math.floor((new Date() - new Date(ds)) / (1000*60*60*24));
    }

    function renderStreak() {
      const d  = getStreakData();
      const ok = d.history?.includes(todayStr()) || isSameDay(d.lastClaimed);
      document.getElementById('streak-badge').textContent = d.count === 0 ? '🔥 Start your streak!' : `🔥 ${d.count} day streak`;
      const btn = document.getElementById('claim-btn');
      btn.textContent = ok ? '✅ Claimed Today' : '⚡ Claim Today';
      btn.disabled    = ok;
    }

    function claimStreak() {
      const d = getStreakData(), today = todayStr();
      if (d.history?.includes(today) || isSameDay(d.lastClaimed)) return;
      const days = getDaysDiff(d.lastClaimed);
      if (!d.lastClaimed || days > 1) d.count = 1;
      else if (isYesterday(d.lastClaimed)) d.count += 1;
      d.lastClaimed = new Date().toISOString();
      if (!d.history) d.history = [];
      d.history.push(today);
      if (d.history.length > 30) d.history = d.history.slice(-30);
      saveStreakData(d); renderStreak();
      const badge = document.getElementById('streak-badge');
      badge.style.transform = 'scale(1.2)'; badge.style.transition = 'transform 0.3s ease';
      setTimeout(() => badge.style.transform = 'scale(1)', 300);
    }

    // ── CLERK ─────────────────────────────────────────────────
    window.addEventListener('load', async () => {
      await Clerk.load();
      updateAuthUI();
      init();
    });

    function updateAuthUI() {
      const authArea    = document.getElementById('nav-auth-area');
      const signinBtn   = document.getElementById('nav-signin-btn');
      const signoutArea = document.getElementById('tasks-signout-area');
      const user        = Clerk.user, session = getUserSession();
      const active      = user || session;

      if (active) {
        const firstName = user?.firstName || session?.firstName || 'Friend';
        const avatar    = user?.imageUrl  || session?.imageUrl  || '';
        signinBtn.style.display = 'none';
        authArea.innerHTML = `
          <div class="user-pill">
            ${avatar ? `<img src="${avatar}" class="user-avatar-sm" alt="${firstName}">` : ''}
            <span class="user-pill-name">${firstName}</span>
          </div>`;
        if (signoutArea) signoutArea.innerHTML = `
          <button class="btn-signout-tasks" onclick="handleSignOut()">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Sign Out
          </button>`;
        const g = document.getElementById('dash-greeting');
        if (g) g.innerHTML = `Keep pushing,<br><span class="accent">${firstName}.</span>`;
        document.getElementById('auth-gate').classList.remove('visible');
        document.getElementById('app-main').style.display = 'block';
      } else {
        signinBtn.style.display = 'block'; authArea.innerHTML = '';
        if (signoutArea) signoutArea.innerHTML = '';
        document.getElementById('auth-gate').classList.remove('visible');
        document.getElementById('app-main').style.display = 'block';
      }
    }

    function openSignIn() {
      Clerk.openSignIn({
        afterSignInUrl: window.location.href, afterSignUpUrl: window.location.href,
        appearance: { variables: { colorPrimary:'#FF5C00', colorBackground:'#1A1A1A', colorText:'#f3f4f6', colorInputBackground:'#0E0E0E', colorInputText:'#f3f4f6', borderRadius:'16px' } }
      });
    }
    async function signInWithGoogle() { await Clerk.redirectToSignIn({ redirectUrl: window.location.href, afterSignInUrl: window.location.href, afterSignUpUrl: window.location.href }); }
    async function signInWithEmail()  { openSignIn(); }
    async function handleSignOut()    { await Clerk.signOut(); clearUserSession(); updateAuthUI(); window.location.reload(); }

    function showPage(id) {
      const user = Clerk.user || getUserSession();
      if (id === 'dashboard' && !user) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('auth-gate').classList.add('visible');
        document.getElementById('tab-quotes').classList.remove('active');
        document.getElementById('tab-dashboard').classList.add('active');
        return;
      }
      document.getElementById('auth-gate').classList.remove('visible');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + id).classList.add('active');
      document.getElementById('tab-quotes').classList.toggle('active',    id === 'quotes');
      document.getElementById('tab-dashboard').classList.toggle('active', id === 'dashboard');
    }

    function init() {
      const today = new Date();
      document.getElementById('hero-date').textContent = today.toLocaleDateString('en-US',
        { day:'numeric', month:'long', year:'numeric' });
      refreshBackground();
      initDailyQuote();
      renderDashboard();
      renderStreak();
      if (Clerk.user) saveUserSession(Clerk.user);
    }

    function refreshBackground() {
      const img = document.getElementById('dynamic-bg');
      img.src = bgImages[Math.floor(Math.random() * bgImages.length)] + '&sig=' + Math.random();
    }

    function renderDashboard() {
      const goalList = document.getElementById('goal-items');
      goalList.innerHTML = goals.map((g, i) => `
        <div class="goal-item">
          <div class="goal-check ${g.done?'checked':''}" onclick="toggleGoal(${i})">
            ${g.done?'<svg width="12" height="12" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>':''}
          </div>
          <div class="goal-info">
            <div class="goal-name ${g.done?'done':''}">${g.name}</div>
            <div class="progress-track"><div class="progress-fill" style="width:${g.done?100:g.progress}%"></div></div>
          </div>
        </div>`).join('');
      const done = goals.filter(g => g.done).length;
      document.getElementById('goals-done').textContent   = done;
      document.getElementById('goals-active').textContent = goals.length - done;
      document.getElementById('goals-pct').textContent    = goals.length ? Math.round((done/goals.length)*100)+'%' : '0%';
      const bars = [40,70,45,90,65,80,20];
      document.getElementById('bar-chart').innerHTML = bars.map(h => `<div class="bar-col"><div class="bar-fill" style="height:${h}%"></div></div>`).join('');
      document.getElementById('bar-days').innerHTML  = ['M','T','W','T','F','S','S'].map(d => `<span class="bar-day">${d}</span>`).join('');
    }

    function toggleGoal(i) { goals[i].done = !goals[i].done; renderDashboard(); }
    function openModal()   { document.getElementById('modal').classList.add('open'); document.getElementById('goal-input').focus(); }
    function closeModal()  { document.getElementById('modal').classList.remove('open'); }
    function addGoal() {
      const val = document.getElementById('goal-input').value.trim();
      if (val) { goals.push({ name:val, done:false, progress:0 }); renderDashboard(); closeModal(); document.getElementById('goal-input').value=''; }
    }

    async function downloadQuoteImage() {
      const card = document.getElementById('quote-hero-card');
      const btn  = document.getElementById('save-btn');
      const orig = btn.innerHTML;
      btn.disabled = true; btn.textContent = 'Processing…';
      try {
        const canvas = await html2canvas(card, { useCORS:true, scale:3, backgroundColor:'#000', logging:false });
        const a = document.createElement('a');
        a.download = 'motiv-' + new Date().toISOString().slice(0,10) + '.jpg';
        a.href = canvas.toDataURL('image/jpeg', 0.95);
        a.click();
        btn.textContent = '✓ Saved!';
      } catch { btn.textContent = 'Error — try again'; }
      finally { setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 2000); }
    }
  </script>
</body>
