  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:   #FF5C00;
      --solar:   #FFD600;
      --dark:    #0E0E0E;
      --surface: #1A1A1A;
      --text:    #f3f4f6;
      --muted:   #9ca3af;
      --border:  rgba(255,255,255,0.08);
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem;
      background: rgba(14,14,14,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 1.2rem;
      display: flex; align-items: center; gap: 0.5rem;
    }

    .pulse-dot {
      width: 10px; height: 10px;
      background: var(--brand); border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(1.3); }
    }

    .nav-right { display: flex; align-items: center; gap: 1rem; }

    .tab-group {
      display: flex; background: var(--surface);
      padding: 4px; border-radius: 14px; gap: 2px;
    }
    .tab-btn {
      padding: 8px 20px; font-size: 0.85rem; font-weight: 600;
      border-radius: 10px; border: none; cursor: pointer;
      transition: all 0.2s; font-family: 'DM Sans', sans-serif;
      background: transparent; color: var(--muted);
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active {
      background: var(--brand); color: #fff;
      box-shadow: 0 4px 14px rgba(255,92,0,0.4);
    }

    /* ── USER AREA (Clerk) ── */
    .user-area {
      display: flex; align-items: center; gap: 0.75rem;
    }

    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid var(--brand); object-fit: cover;
      cursor: pointer; transition: transform 0.2s;
    }
    .user-avatar:hover { transform: scale(1.08); }

    .user-name {
      font-size: 0.78rem; font-weight: 700;
      color: var(--text); max-width: 90px;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }

    .auth-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text); padding: 8px 16px;
      border-radius: 12px; font-size: 0.75rem; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .auth-btn:hover { background: rgba(255,255,255,0.1); }

    .sign-out-btn {
      background: transparent;
      border: 1px solid rgba(255,92,0,0.3);
      color: var(--brand); padding: 6px 12px;
      border-radius: 10px; font-size: 0.72rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .sign-out-btn:hover { background: rgba(255,92,0,0.1); }

    .user-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,92,0,0.12);
      border: 1px solid rgba(255,92,0,0.25);
      border-radius: 10px; padding: 6px 12px;
    }
    .user-avatar-sm {
      width: 22px; height: 22px; border-radius: 50%;
      object-fit: cover; border: 1px solid var(--brand);
    }
    .user-pill-name {
      font-size: 0.78rem; font-weight: 700;
      color: var(--brand); max-width: 80px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .btn-signout-tasks {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; width: 100%; margin-top: 0.75rem;
      padding: 12px; border-radius: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted); font-weight: 600; font-size: 0.85rem;
      cursor: pointer; transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-signout-tasks:hover {
      border-color: rgba(255,92,0,0.3);
      color: var(--brand);
      background: rgba(255,92,0,0.05);
    }

    /* ── AUTH GATE SCREEN ── */
    #auth-gate {
      display: none;
      flex-direction: column; align-items: center;
      justify-content: center; min-height: 80vh;
      text-align: center; padding: 2rem;
    }
    #auth-gate.visible { display: flex; }

    .gate-logo {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 3rem; color: var(--brand);
      margin-bottom: 0.5rem;
      text-shadow: 0 0 40px rgba(255,92,0,0.4);
    }

    .gate-tagline {
      color: var(--muted); font-size: 1rem;
      margin-bottom: 2.5rem; max-width: 300px; line-height: 1.6;
    }

    .gate-btns { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; max-width: 280px; }

    .gate-btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 20px; border-radius: 16px;
      background: #fff; color: #1a1a1a;
      font-weight: 700; font-size: 0.9rem;
      border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .gate-btn-google:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }

    .gate-btn-email {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 20px; border-radius: 16px;
      background: var(--brand); color: #fff;
      font-weight: 700; font-size: 0.9rem;
      border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 20px rgba(255,92,0,0.35);
      transition: transform 0.15s, opacity 0.15s;
    }
    .gate-btn-email:hover { transform: translateY(-2px); opacity: 0.9; }

    .gate-divider {
      color: var(--muted); font-size: 0.75rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .gate-divider::before, .gate-divider::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(255,255,255,0.08);
    }

    /* ── MAIN ── */
    main { padding: 1rem; max-width: 680px; margin: 0 auto; }

    /* ── PAGE VISIBILITY ── */
    .page        { display: none; }
    .page.active { display: block; }

    /* ── QUOTE CARD ── */
    #quote-hero-card {
      position: relative; border-radius: 36px;
      overflow: hidden; background: #000;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      aspect-ratio: 9 / 16; width: 100%;
      -webkit-font-smoothing: antialiased;
    }

    #dynamic-bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
      transition: opacity 0.6s ease;
    }

    .card-overlay {
      position: absolute; inset: 0;
      background: radial-gradient(circle,
        rgba(0,0,0,0.1) 0%,
        rgba(0,0,0,0.4) 50%,
        rgba(0,0,0,0.82) 100%);
    }

    .card-brand-tag {
      position: absolute; top: 2rem; right: 2rem; z-index: 20;
      font-family: 'Syne', sans-serif; font-size: 11px;
      letter-spacing: 0.35em; text-transform: uppercase;
      color: #fff; font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .card-content {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2.5rem; text-align: center;
    }

    .card-eyebrow {
      font-family: 'Syne', sans-serif; font-size: 10px;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(255,255,255,0.85); font-weight: 700;
      margin-bottom: 1.4rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    #hero-text {
      font-family: 'Syne', sans-serif; font-style: italic;
      color: #fff; line-height: 1.25; font-weight: 700;
      font-size: clamp(22px, 6.5vw, 36px);
      text-shadow: 0 4px 24px rgba(0,0,0,0.8);
      margin-bottom: 1.5rem;
      min-height: 120px;
    }

    .card-author-wrap {
      display: flex; flex-direction: column;
      align-items: center; margin-bottom: 2rem;
    }

    #hero-author {
      font-weight: 700; color: #fff; font-size: 17px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      margin-bottom: 4px;
    }

    #hero-year {
      font-weight: 700; color: var(--solar); font-size: 13px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    #hero-date {
      background: var(--solar); color: #000; font-weight: 700;
      border-radius: 999px; padding: 0 1.2rem; height: 32px;
      font-size: 11px; display: inline-flex;
      align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .card-actions {
      position: absolute; bottom: 2rem; left: 0; right: 0;
      z-index: 20; padding: 0 2rem;
      display: flex; gap: 0.75rem;
    }

    .btn-save {
      flex: 1; display: flex; align-items: center;
      justify-content: center; gap: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 14px 0; border-radius: 18px;
      font-weight: 700; font-size: 13px; cursor: pointer;
      backdrop-filter: blur(8px); transition: background 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-save:hover  { background: rgba(255,255,255,0.2); }
    .btn-save:disabled { opacity: 0.6; cursor: default; }

    .btn-refresh {
      padding: 14px; border-radius: 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff; cursor: pointer;
      backdrop-filter: blur(8px); transition: background 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-refresh:hover { background: rgba(255,255,255,0.1); }

    .btn-refresh.spinning svg {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ── DASHBOARD ── */
    #page-dashboard { padding-top: 1.5rem; }

    .dash-header {
      display: flex; flex-wrap: wrap;
      justify-content: space-between; align-items: flex-end;
      gap: 1rem; margin-bottom: 1.5rem;
    }

    .dash-title {
      font-family: 'Syne', sans-serif;
      font-size: 2.4rem; font-weight: 800; line-height: 1.1;
    }
    .dash-title .accent { color: var(--brand); }

    .streak-right {
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 0.5rem;
    }

    .streak-badge {
      background: rgba(255,214,0,0.1);
      border: 1px solid rgba(255,214,0,0.25);
      color: var(--solar); font-weight: 700;
      font-size: 0.85rem; padding: 6px 16px;
      border-radius: 999px;
    }

    .claim-btn {
      background: var(--brand); color: #fff;
      border: none; border-radius: 12px;
      padding: 8px 18px; font-size: 0.8rem;
      font-weight: 700; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 14px rgba(255,92,0,0.4);
      transition: transform 0.15s, opacity 0.15s;
    }
    .claim-btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .claim-btn:disabled {
      background: rgba(255,255,255,0.08);
      color: var(--muted); box-shadow: none;
      cursor: default; transform: none; opacity: 1;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem; margin-bottom: 1.5rem;
    }
    @media (min-width: 540px) {
      .stats-grid { grid-template-columns: 1fr 1fr 1fr; }
      .stat-wide  { grid-column: auto; }
    }

    .stat-card { padding: 1.5rem; border-radius: 24px; }
    .stat-card.orange {
      background: var(--brand); color: #fff;
      box-shadow: 0 8px 24px rgba(255,92,0,0.35);
    }
    .stat-card.dark {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stat-wide { grid-column: span 2; }
    @media (min-width: 540px) { .stat-wide { grid-column: span 1; } }

    .stat-label {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.12em; font-weight: 700;
      margin-bottom: 0.5rem; color: var(--muted);
    }
    .stat-card.orange .stat-label { color: rgba(255,255,255,0.75); }

    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 2.4rem; font-weight: 800; line-height: 1;
      color: var(--text);
    }
    .stat-value.yellow { color: var(--solar); }

    .panels-grid { display: grid; gap: 1.5rem; }
    @media (min-width: 540px) { .panels-grid { grid-template-columns: 1fr 1fr; } }

    .panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px; padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .panel-title {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.12em; color: #6b7280;
      font-weight: 700; margin-bottom: 1.5rem;
    }

    #bar-chart {
      display: flex; align-items: flex-end;
      gap: 0.5rem; height: 8rem; margin-bottom: 1rem;
    }

    .bar-col {
      flex: 1; background: rgba(255,255,255,0.05);
      border-radius: 6px 6px 0 0;
      position: relative; height: 100%;
    }

    .bar-fill {
      position: absolute; bottom: 0; width: 100%;
      background: var(--solar); border-radius: 4px 4px 0 0;
    }

    #bar-days { display: flex; justify-content: space-between; padding: 0 2px; }

    .bar-day {
      font-size: 10px; font-weight: 700;
      color: #6b7280; flex: 1; text-align: center;
    }

    .goal-item {
      display: flex; align-items: center; gap: 1rem;
      background: var(--dark); padding: 1rem;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 0.75rem;
      transition: border-color 0.2s;
    }
    .goal-item:hover { border-color: rgba(255,255,255,0.1); }

    .goal-check {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s;
    }
    .goal-check.checked { background: var(--brand); border-color: var(--brand); }

    .goal-info { flex: 1; min-width: 0; }

    .goal-name {
      font-size: 0.875rem; font-weight: 700;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; margin-bottom: 6px; color: var(--text);
    }
    .goal-name.done { text-decoration: line-through; color: #6b7280; }

    .progress-track {
      width: 100%; background: rgba(255,255,255,0.08);
      height: 4px; border-radius: 999px; overflow: hidden;
    }

    .progress-fill {
      height: 100%; background: var(--brand);
      border-radius: 999px; transition: width 0.4s ease;
    }

    .btn-add {
      width: 100%; padding: 14px;
      border: 2px dashed rgba(255,255,255,0.1);
      border-radius: 16px; color: #6b7280;
      font-weight: 700; background: rgba(255,255,255,0.03);
      cursor: pointer; transition: all 0.2s;
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
    }
    .btn-add:hover { border-color: var(--brand); color: var(--brand); }

    /* ── MODAL ── */
    #modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      z-index: 100; display: none;
      align-items: center; justify-content: center;
      padding: 1rem;
    }
    #modal.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.1);
      width: 100%; max-width: 360px;
      border-radius: 28px; padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }

    .modal-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem; color: #fff; margin-bottom: 1.5rem;
    }

    .modal-input {
      width: 100%; background: var(--dark);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px;
      margin-bottom: 1.5rem; outline: none;
      color: #fff; font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; transition: border-color 0.2s;
    }
    .modal-input:focus { border-color: var(--brand); }

    .modal-actions { display: flex; gap: 0.75rem; }

    .btn-cancel {
      flex: 1; padding: 12px; background: transparent;
      color: var(--muted); font-weight: 600; cursor: pointer;
      border: none; font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; transition: color 0.2s; border-radius: 12px;
    }
    .btn-cancel:hover { color: #fff; }

    .btn-confirm {
      flex: 1; padding: 12px; background: var(--brand);
      color: #fff; font-weight: 700; cursor: pointer;
      border: none; border-radius: 12px;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
      box-shadow: 0 4px 14px rgba(255,92,0,0.4);
      transition: opacity 0.2s;
    }
    .btn-confirm:hover { opacity: 0.85; }

    /* ── LOADING STATES ── */
    .quote-loading {
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
      color: rgba(255,255,255,0.6);
    }
    .quote-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .special-day-badge {
      background: linear-gradient(135deg, var(--brand), #ff8c00);
      color: #fff; padding: 4px 12px;
      border-radius: 20px; font-size: 10px;
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; margin-bottom: 1rem;
      display: inline-block;
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-logo">
      <div class="pulse-dot"></div>
      Motiv
    </div>
    <div class="nav-right">
      <div class="tab-group">
        <button onclick="showPage('quotes')"    id="tab-quotes"    class="tab-btn active">Quotes</button>
        <button onclick="showPage('dashboard')" id="tab-dashboard" class="tab-btn">Dashboard</button>
        <!-- ✅ FIXED: Separate Sign In button, only shows when logged out -->
        <button onclick="openSignIn()" id="nav-signin-btn" class="tab-btn" style="display:none; color:#FF5C00; font-weight:700;">Sign In</button>
        <div id="nav-auth-area"></div>
      </div>
    </div>
  </nav>

  <!-- ✅ CLERK: Auth gate — shown to signed-out users on protected pages -->
  <div id="auth-gate">
    <div class="gate-logo">Motiv</div>
    <p class="gate-tagline">Your daily dose of inspiration and goal tracking. Sign in to get started.</p>
    <div class="gate-btns">
      <button class="gate-btn-google" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
      <div class="gate-divider">or</div>
      <button class="gate-btn-email" onclick="signInWithEmail()">
        ✉️ &nbsp;Sign in with Email
      </button>
    </div>
  </div>

  <main id="app-main">

    <!-- QUOTES -->
    <div id="page-quotes" class="page active">
      <div id="quote-hero-card">
        <img id="dynamic-bg" crossorigin="anonymous" src="" alt="Daily Motivation">
        <div class="card-overlay"></div>
        <div class="card-brand-tag">Motiv</div>
        <div class="card-content">
          <span class="card-eyebrow">Daily Wisdom</span>
          <div id="special-day-badge" class="special-day-badge" style="display:none;"></div>
          <p id="hero-text">
            <span class="quote-loading">
              <div class="quote-spinner"></div>
              Generating inspiration...
            </span>
          </p>
          <div class="card-author-wrap">
            <p id="hero-author">— AI Curator</p>
            <p id="hero-year"></p>
          </div>
          <div id="hero-date"></div>
        </div>
        <div class="card-actions" data-html2canvas-ignore="true">
          <button onclick="downloadQuoteImage()" id="save-btn" class="btn-save">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            Save Quote
          </button>
          <button onclick="refreshQuote()" id="refresh-btn" class="btn-refresh" title="New Quote">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="page-dashboard" class="page">
      <div class="dash-header">
        <h2 class="dash-title" id="dash-greeting">Keep<br>pushing, <span class="accent">champ.</span></h2>
        <div class="streak-right"><div class="streak-badge" id="streak-badge">🔥 0 day streak</div><button onclick="claimStreak()" id="claim-btn" class="claim-btn">⚡ Claim Today</button></div>
      </div>

      <div class="stats-grid">
        <div class="stat-card orange">
          <div class="stat-label">Goals Done</div>
          <div id="goals-done" class="stat-value">0</div>
        </div>
        <div class="stat-card dark">
          <div class="stat-label">Active</div>
          <div id="goals-active" class="stat-value">0</div>
        </div>
        <div class="stat-card dark stat-wide">
          <div class="stat-label">Completion</div>
          <div id="goals-pct" class="stat-value yellow">0%</div>
        </div>
      </div>

      <div class="panels-grid">
        <div class="panel">
          <div class="panel-title">Weekly Activity</div>
          <div id="bar-chart"></div>
          <div id="bar-days"></div>
        </div>
        <div class="panel">
          <div class="panel-title">Today's Tasks</div>
          <div id="goal-items"></div>
          <button onclick="openModal()" class="btn-add">+ Add new goal</button>
          <div id="tasks-signout-area"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- MODAL -->
  <div id="modal">
    <div class="modal-box">
      <div class="modal-title">New Goal</div>
      <input type="text" id="goal-input" placeholder="What are we crushing?" class="modal-input">
      <div class="modal-actions">
        <button onclick="closeModal()" class="btn-cancel">Cancel</button>
        <button onclick="addGoal()"    class="btn-confirm">Add Goal</button>
      </div>
    </div>
  </div>

  <script>
    // ── SPECIAL DAYS SYSTEM ───────────────────────────────────
    // Lightweight holiday/special day detection without external API
    const specialDays = {
      '01-01': { name: "New Year's Day", theme: "new beginnings" },
      '02-14': { name: "Valentine's Day", theme: "love and connection" },
      '03-08': { name: "International Women's Day", theme: "empowerment and equality" },
      '03-17': { name: "St. Patrick's Day", theme: "luck and fortune" },
      '04-01': { name: "April Fools' Day", theme: "humor and perspective" },
      '04-07': { name: "World Health Day", theme: "wellness and self-care" },
      '04-22': { name: "Earth Day", theme: "nature and sustainability" },
      '05-01': { name: "Labor Day", theme: "hard work and dedication" },
      '05-04': { name: "Star Wars Day", theme: "hope and rebellion" },
      '06-05': { name: "World Environment Day", theme: "environmental stewardship" },
      '06-21': { name: "International Yoga Day", theme: "mindfulness and balance" },
      '07-04': { name: "Independence Day (US)", theme: "freedom and liberty" },
      '09-05': { name: "International Day of Charity", theme: "kindness and giving" },
      '10-10': { name: "World Mental Health Day", theme: "mental wellness" },
      '10-31': { name: "Halloween", theme: "facing fears" },
      '11-11': { name: "Veterans Day", theme: "courage and service" },
      '11-28': { name: "Thanksgiving (US)", theme: "gratitude" },
      '12-25': { name: "Christmas Day", theme: "joy and giving" },
      '12-31': { name: "New Year's Eve", theme: "reflection and hope" }
    };

    function getSpecialDay() {
      const today = new Date();
      const key = `${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      return specialDays[key] || null;
    }

    function getDayOfWeekTheme() {
      const day = new Date().getDay();
      const themes = [
        "reflection and preparation", // Sunday
        "ambition and fresh starts",  // Monday
        "productivity and progress",  // Tuesday
        "connection and collaboration", // Wednesday
        "determination and resilience", // Thursday
        "celebration and accomplishment", // Friday
        "adventure and exploration"   // Saturday
      ];
      return themes[day];
    }

    // ── LLM QUOTE GENERATION ──────────────────────────────────
    // Uses Puter.js for free LLM access - no API key needed
    
    let currentQuote = null;
    let isGenerating = false;

    async function generateSmartQuote() {
      if (isGenerating) return;
      isGenerating = true;
      
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');
      
      const specialDay = getSpecialDay();
      const dayTheme = getDayOfWeekTheme();
      
      let prompt;
      if (specialDay) {
        prompt = `Generate an inspiring, motivational quote for ${specialDay.name}. The theme is ${specialDay.theme}. Make it sound like it could be from a famous philosopher or modern thought leader. Keep it under 20 words. Only return the quote text, no attribution or explanation.`;
      } else {
        prompt = `Generate an inspiring, motivational quote about ${dayTheme}. Make it sound wise and timeless, like from a famous author or philosopher. Keep it under 20 words. Only return the quote text, no attribution or explanation.`;
      }

      try {
        // Use Puter.ai.chat() for free LLM generation [^10^]
        const response = await puter.ai.chat(prompt, {
          model: "gpt-4o-mini" // Fast, cost-effective model
        });
        
        const quoteText = response.trim().replace(/^["']|["']$/g, '');
        currentQuote = {
          text: quoteText,
          author: specialDay ? `— ${specialDay.name}` : "— Daily Wisdom",
          year: new Date().getFullYear().toString(),
          isSpecial: !!specialDay,
          specialDayName: specialDay?.name
        };
        
        renderQuote();
      } catch (error) {
        console.error('Quote generation failed:', error);
        // Fallback to generic inspirational message
        currentQuote = {
          text: "The best way to predict the future is to create it.",
          author: "— Peter Drucker",
          year: "2024",
          isSpecial: false
        };
        renderQuote();
      } finally {
        isGenerating = false;
        btn.classList.remove('spinning');
      }
    }

    function renderQuote() {
      if (!currentQuote) return;
      
      const textEl = document.getElementById('hero-text');
      const authorEl = document.getElementById('hero-author');
      const yearEl = document.getElementById('hero-year');
      const badgeEl = document.getElementById('special-day-badge');
      
      // Animate text change
      textEl.style.opacity = '0';
      setTimeout(() => {
        textEl.textContent = `"${currentQuote.text}"`;
        authorEl.textContent = currentQuote.author;
        yearEl.textContent = currentQuote.year;
        
        if (currentQuote.isSpecial) {
          badgeEl.textContent = `✨ ${currentQuote.specialDayName}`;
          badgeEl.style.display = 'inline-block';
        } else {
          badgeEl.style.display = 'none';
        }
        
        textEl.style.opacity = '1';
      }, 200);
    }

    function refreshQuote() {
      generateSmartQuote();
    }

    // ── DATA ──────────────────────────────────────────────────
    const bgImages = [
      'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1080&q=80',
      'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1080&q=80',
      'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1080&q=80',
      'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1080&q=80',
      'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1080&q=80'
    ];

    let goals = [
      { name: 'Morning Meditation', done: true,  progress: 100 },
      { name: 'Push-up Challenge',  done: false, progress: 40  }
    ];

    // ── CLERK AUTH ────────────────────────────────────────────
    // ✅ FIXED: Clear separation between Sign In and Dashboard

    // ── STREAK LOGIC ──────────────────────────────────────────
    function getStreakData() {
      const raw = localStorage.getItem('motiv_streak');
      return raw ? JSON.parse(raw) : { count: 0, lastClaimed: null };
    }

    function saveStreakData(data) {
      localStorage.setItem('motiv_streak', JSON.stringify(data));
    }

    function isSameDay(dateStr) {
      if (!dateStr) return false;
      const last = new Date(dateStr);
      const now  = new Date();
      return last.getFullYear() === now.getFullYear() &&
             last.getMonth()    === now.getMonth()    &&
             last.getDate()     === now.getDate();
    }

    function isYesterday(dateStr) {
      if (!dateStr) return false;
      const last = new Date(dateStr);
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      return last.getFullYear() === yesterday.getFullYear() &&
             last.getMonth()    === yesterday.getMonth()    &&
             last.getDate()     === yesterday.getDate();
    }

    function renderStreak() {
      const { count, lastClaimed } = getStreakData();
      const alreadyClaimed = isSameDay(lastClaimed);

      document.getElementById('streak-badge').textContent =
        count === 0 ? '🔥 0 day streak'
        : count === 1 ? '🔥 1 day streak'
        : `🔥 ${count} day streak`;

      const btn = document.getElementById('claim-btn');
      if (alreadyClaimed) {
        btn.textContent  = '✅ Claimed';
        btn.disabled     = true;
      } else {
        btn.textContent  = '⚡ Claim Today';
        btn.disabled     = false;
      }
    }

    function claimStreak() {
      const data = getStreakData();
      const today = new Date().toISOString();

      if (isSameDay(data.lastClaimed)) return;

      if (isYesterday(data.lastClaimed)) {
        data.count += 1;
      } else {
        data.count = 1;
      }

      data.lastClaimed = today;
      saveStreakData(data);
      renderStreak();

      const badge = document.getElementById('streak-badge');
      badge.style.transform = 'scale(1.15)';
      badge.style.transition = 'transform 0.2s';
      setTimeout(() => { badge.style.transform = 'scale(1)'; }, 200);
    }

    window.addEventListener('load', async () => {
      await Clerk.load();
      updateAuthUI();
      init();
    });

    function updateAuthUI() {
      const authArea      = document.getElementById('nav-auth-area');
      const signinBtn     = document.getElementById('nav-signin-btn');
      const signoutArea   = document.getElementById('tasks-signout-area');
      const user          = Clerk.user;

      if (user) {
        const firstName = user.firstName || user.emailAddresses[0]?.emailAddress?.split('@')[0] || 'Friend';
        const avatar    = user.imageUrl || '';

        // Show user pill, hide sign in button
        signinBtn.style.display = 'none';
        authArea.innerHTML = `
          <div class="user-pill">
            ${avatar ? `<img src="${avatar}" class="user-avatar-sm" alt="${firstName}">` : ''}
            <span class="user-pill-name">${firstName}</span>
          </div>`;

        // Tasks panel: show sign-out button
        if (signoutArea) {
          signoutArea.innerHTML = `
            <button class="btn-signout-tasks" onclick="handleSignOut()">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              Sign Out
            </button>`;
        }

        // Update dashboard greeting
        const greetingEl = document.getElementById('dash-greeting');
        if (greetingEl) {
          greetingEl.innerHTML = `Keep pushing,<br><span class="accent">${firstName}.</span>`;
        }

        document.getElementById('auth-gate').classList.remove('visible');
        document.getElementById('app-main').style.display = 'block';

      } else {
        // Show Sign In button, clear user pill
        signinBtn.style.display = 'block';
        authArea.innerHTML = '';

        // Tasks panel: no sign-out needed
        if (signoutArea) signoutArea.innerHTML = '';

        document.getElementById('auth-gate').classList.remove('visible');
        document.getElementById('app-main').style.display = 'block';
      }
    }

    // ✅ FIXED: Explicit Sign In function
    function openSignIn() {
      Clerk.openSignIn({
        afterSignInUrl: window.location.href,
        afterSignUpUrl: window.location.href,
        appearance: {
          variables: {
            colorPrimary: '#FF5C00',
            colorBackground: '#1A1A1A',
            colorText: '#f3f4f6',
            colorInputBackground: '#0E0E0E',
            colorInputText: '#f3f4f6',
            borderRadius: '16px',
          }
        }
      });
    }

    async function signInWithGoogle() {
      await Clerk.redirectToSignIn({
        redirectUrl: window.location.href,
        afterSignInUrl: window.location.href,
        afterSignUpUrl: window.location.href,
      });
    }

    async function signInWithEmail() {
      Clerk.openSignIn({
        afterSignInUrl: window.location.href,
        afterSignUpUrl: window.location.href,
        appearance: {
          variables: {
            colorPrimary: '#FF5C00',
            colorBackground: '#1A1A1A',
            colorText: '#f3f4f6',
            colorInputBackground: '#0E0E0E',
            colorInputText: '#f3f4f6',
            borderRadius: '16px',
          }
        }
      });
    }

    async function handleSignOut() {
      await Clerk.signOut();
      updateAuthUI();
    }

    // ✅ FIXED: Dashboard is now protected, Sign In is separate
    function showPage(id) {
      if (id === 'dashboard' && !Clerk.user) {
        // Show auth gate for dashboard when not logged in
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('auth-gate').classList.add('visible');
        document.getElementById('tab-quotes').classList.remove('active');
        document.getElementById('tab-dashboard').classList.add('active');
        return;
      }

      document.getElementById('auth-gate').classList.remove('visible');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + id).classList.add('active');
      document.getElementById('tab-quotes').classList.toggle('active',    id === 'quotes');
      document.getElementById('tab-dashboard').classList.toggle('active', id === 'dashboard');
    }

    // ── INIT ──────────────────────────────────────────────────
    function init() {
      const today = new Date();
      document.getElementById('hero-date').textContent = today.toLocaleDateString('en-US',
        { day: 'numeric', month: 'long', year: 'numeric' });

      refreshBackground();
      generateSmartQuote(); // Generate dynamic quote instead of hardcoded
      renderDashboard();
      renderStreak();
    }

    // ── BACKGROUND ────────────────────────────────────────────
    function refreshBackground() {
      const img = document.getElementById('dynamic-bg');
      img.src = bgImages[Math.floor(Math.random() * bgImages.length)] + '&sig=' + Math.random();
    }

    // ── DASHBOARD ─────────────────────────────────────────────
    function renderDashboard() {
      const goalList = document.getElementById('goal-items');
      goalList.innerHTML = goals.map((g, i) => `
        <div class="goal-item">
          <div class="goal-check ${g.done ? 'checked' : ''}" onclick="toggleGoal(${i})">
            ${g.done
              ? '<svg width="12" height="12" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>'
              : ''}
          </div>
          <div class="goal-info">
            <div class="goal-name ${g.done ? 'done' : ''}">${g.name}</div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${g.done ? 100 : g.progress}%"></div>
            </div>
          </div>
        </div>`).join('');

      const doneCount = goals.filter(g => g.done).length;
      document.getElementById('goals-done').textContent   = doneCount;
      document.getElementById('goals-active').textContent = goals.length - doneCount;
      document.getElementById('goals-pct').textContent    = goals.length
        ? Math.round((doneCount / goals.length) * 100) + '%' : '0%';

      const bars = [40, 70, 45, 90, 65, 80, 20];
      document.getElementById('bar-chart').innerHTML = bars.map(h =>
        `<div class="bar-col"><div class="bar-fill" style="height:${h}%"></div></div>`).join('');
      document.getElementById('bar-days').innerHTML = ['M','T','W','T','F','S','S'].map(d =>
        `<span class="bar-day">${d}</span>`).join('');
    }

    function toggleGoal(i)  { goals[i].done = !goals[i].done; renderDashboard(); }
    function openModal()     { document.getElementById('modal').classList.add('open'); document.getElementById('goal-input').focus(); }
    function closeModal()    { document.getElementById('modal').classList.remove('open'); }
    function addGoal() {
      const val = document.getElementById('goal-input').value.trim();
      if (val) { goals.push({ name: val, done: false, progress: 0 }); renderDashboard(); closeModal(); document.getElementById('goal-input').value = ''; }
    }

    // ── DOWNLOAD ──────────────────────────────────────────────
    async function downloadQuoteImage() {
      const card = document.getElementById('quote-hero-card');
      const btn  = document.getElementById('save-btn');
      const orig = btn.innerHTML;
      btn.disabled = true; btn.textContent = 'Processing…';
      try {
        const canvas = await html2canvas(card, { useCORS: true, scale: 3, backgroundColor: '#000', logging: false });
        const a = document.createElement('a');
        a.download = 'motiv-' + new Date().toISOString().slice(0,10) + '.jpg';
        a.href = canvas.toDataURL('image/jpeg', 0.95);
        a.click();
        btn.textContent = '✓ Saved!';
      } catch(e) {
        btn.textContent = 'Error — try again';
      } finally {
        setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 2000);
      }
    }
  </script>
</body>
