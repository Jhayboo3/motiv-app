<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Motiv — Daily Inspiration</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#FF5C00', solar: '#FFD600', dark: '#0E0E0E', surface: '#1A1A1A' },
          fontFamily: { head: ['Syne', 'sans-serif'], body: ['DM Sans', 'sans-serif'] }
        }
      }
    }
  </script>
  
  <style>
    .quote-shadow { text-shadow: 0 4px 24px rgba(0,0,0,0.8); }
    .text-shadow-sm { text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    #quote-hero-card { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .bg-transition { transition: opacity 0.6s ease-in-out; }
  </style>
</head>

<body class="bg-dark text-gray-100 font-body min-h-screen">

  <nav class="sticky top-0 z-50 flex items-center justify-between px-6 py-4 bg-dark/80 backdrop-blur-md border-b border-white/10">
    <div class="font-head font-800 text-xl flex items-center gap-2">
      <span class="w-3 h-3 bg-brand rounded-full animate-pulse"></span> Motiv
    </div>
    
    <div class="flex items-center gap-4">
      <div class="flex bg-surface p-1 rounded-xl">
        <button onclick="showPage('quotes')" id="tab-quotes" class="px-5 py-2 text-sm font-medium rounded-lg transition-all bg-brand text-white shadow-lg">Quotes</button>
        <button onclick="showPage('dashboard')" id="tab-dashboard" class="px-5 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white">Dashboard</button>
      </div>
      
      <button id="auth-btn" onclick="handleAuthClick()" class="bg-white/5 border border-white/10 px-4 py-2 rounded-xl text-xs font-bold hover:bg-white/10 transition-all">
        Sign In
      </button>
    </div>
  </nav>

  <main class="p-4 max-w-2xl mx-auto">
    <div id="page-quotes" class="page block">
      <div id="quote-hero-card" class="relative rounded-[40px] overflow-hidden shadow-2xl bg-black" style="aspect-ratio: 9/16; width: 100%;">
        <img id="dynamic-bg" crossorigin="anonymous" src="" class="absolute inset-0 w-full h-full object-cover bg-transition" alt="Daily Motivation">
        <div class="absolute inset-0" style="background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.8) 100%);"></div>
        <div class="absolute top-10 right-10 z-20">
          <span class="font-head text-[12px] tracking-[0.4em] uppercase text-white font-800 drop-shadow-md">Motiv</span>
        </div>
        <div class="absolute inset-0 z-10 flex flex-col items-center justify-center p-10 text-center">
          <span class="font-head text-[10px] tracking-[0.3em] uppercase text-white/90 font-bold mb-6 text-shadow-sm">Daily Wisdom</span>
          <p id="hero-text" class="font-head italic text-white quote-shadow mb-6 leading-tight" style="font-size: clamp(26px, 7vw, 38px); font-weight: 700;"></p>
          <div class="flex flex-col items-center mb-8">
            <p id="hero-author" class="font-body font-bold text-white text-shadow-sm mb-1 text-[18px]"></p>
            <p id="hero-year" class="font-body font-bold text-shadow-sm text-[13px] text-solar"></p>
          </div>
          <div id="hero-date" class="bg-solar text-black font-bold rounded-full px-5 h-8 text-[11px] flex items-center justify-center shadow-2xl leading-none"></div>
        </div>
        <div class="absolute bottom-10 left-0 right-0 z-20 px-10 flex gap-3" data-html2canvas-ignore="true">
          <button onclick="downloadQuoteImage()" id="save-btn" class="flex-1 flex items-center justify-center gap-2 bg-white/10 hover:bg-white/20 border border-white/20 text-white py-4 rounded-2xl font-bold transition-all text-[13px] backdrop-blur-md">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span>Save Quote</span>
          </button>
          <button onclick="refreshBackground()" class="p-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl transition-all backdrop-blur-md">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="page-dashboard" class="page hidden space-y-6 pt-4">
      <div class="flex flex-wrap justify-between items-end gap-4">
        <h2 class="font-head text-4xl font-800 leading-tight">Keep<br>pushing, <span class="text-brand">champ.</span></h2>
        <div class="bg-solar/10 border border-solar/20 px-4 py-2 rounded-full text-solar font-bold text-sm">🔥 7 day streak</div>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <div class="bg-brand p-6 rounded-3xl text-white shadow-xl">
          <p class="text-[10px] uppercase tracking-widest opacity-80 mb-2 font-bold">Goals Done</p>
          <p id="goals-done" class="font-head text-4xl font-800">0</p>
        </div>
        <div class="bg-surface p-6 rounded-3xl border border-white/5">
          <p class="text-[10px] uppercase tracking-widest text-gray-400 mb-2 font-bold">Active</p>
          <p id="goals-active" class="font-head text-4xl font-800 text-white">0</p>
        </div>
        <div class="bg-surface p-6 rounded-3xl border border-white/5 col-span-2 md:col-span-1">
          <p class="text-[10px] uppercase tracking-widest text-gray-400 mb-2 font-bold">Completion</p>
          <p id="goals-pct" class="font-head text-4xl font-800 text-solar">0%</p>
        </div>
      </div>
      <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-surface p-6 rounded-3xl border border-white/5 shadow-lg">
            <h3 class="font-head text-[11px] mb-6 text-gray-500 uppercase tracking-widest">Weekly Activity</h3>
            <div id="bar-chart" class="flex items-end gap-3 h-32 mb-4"></div>
            <div id="bar-days" class="flex justify-between px-1"></div>
        </div>
        <div class="bg-surface p-6 rounded-3xl border border-white/5 shadow-lg">
          <h3 class="font-head text-[11px] mb-6 text-gray-500 uppercase tracking-widest">Today's Tasks</h3>
          <div id="goal-items" class="space-y-4 mb-6"></div>
          <button onclick="openModal()" class="w-full py-4 border-2 border-dashed border-white/10 rounded-2xl text-gray-400 hover:border-brand hover:text-brand transition-all font-bold bg-white/5">
            + Add new goal
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
    <div class="bg-surface border border-white/10 w-full max-w-sm rounded-[32px] p-8 shadow-2xl">
      <h3 class="font-head text-xl mb-6 text-white">New Goal</h3>
      <input type="text" id="goal-input" placeholder="What are we crushing?" class="w-full bg-dark border border-white/10 rounded-xl p-4 mb-6 outline-none focus:border-brand text-white transition-colors">
      <div class="flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-3 text-gray-400 font-medium hover:text-white transition-colors">Cancel</button>
        <button onclick="addGoal()" class="flex-1 bg-brand py-3 rounded-xl font-bold text-white shadow-lg">Add Goal</button>
      </div>
    </div>
  </div>

  <script>
    // --- SUPABASE CONFIG ---
    const supabaseUrl = 'https://yokjotrfbnwauzzajfog.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlva2pvdHJmYm53YXV6emFqZm9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMTEzODMsImV4cCI6MjA5MDc4NzM4M30.youFlUsh3d2TvYZmhoLJqzClHZsH_Mr_-cnM4va2vnA';
    
    // RENAMED TO supabaseClient to avoid SyntaxError
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    const quotes = [
      { text: "The secret of getting ahead is getting started.", author: "- Mark Twain", year: "1890" },
      { text: "Believe you can and you're halfway there.", author: "- Theodore Roosevelt", year: "1910" },
      { text: "Success is not final; failure is not fatal.", author: "- Winston Churchill", year: "1941" },
      { text: "Dream big and dare to fail.", author: "- Norman Vaughan", year: "1994" },
      { text: "Stay hungry, stay foolish.", author: "- Steve Jobs", year: "2005" },
      { text: "It always seems impossible until it's done.", author: "- Nelson Mandela", year: "2001" },
      { text: "Discipline is the bridge between goals and accomplishment.", author: "- Jim Rohn", year: "1980" }
    ];

    const bgImages = [
      'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1080&q=80',
      'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1080&q=80',
      'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1080&q=80',
      'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1080&q=80',
      'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1080&q=80'
    ];

    let goals = [
      { name: 'Morning Meditation', done: true, progress: 100 },
      { name: 'Push-up Challenge', done: false, progress: 40 }
    ];

    let currentUser = null;

    async function init() {
      const today = new Date();
      const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
      const q = quotes[dayOfYear % quotes.length];
      
      document.getElementById('hero-text').textContent = `“${q.text}”`;
      document.getElementById('hero-author').textContent = q.author;
      document.getElementById('hero-year').textContent = q.year;
      document.getElementById('nav-date').textContent = today.toLocaleDateString('en-US', { weekday:'short', day:'numeric', month:'short' });
      document.getElementById('hero-date').textContent = today.toLocaleDateString('en-US', { day:'numeric', month:'long', year:'numeric' });

      refreshBackground();
      renderDashboard();
      
      try { await checkUser(); } catch (e) { console.error("Auth init failed"); }
    }

    async function handleAuthClick() {
      if (currentUser) {
        await supabaseClient.auth.signOut();
        location.reload();
      } else {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin }
        });
        if (error) alert("Error: " + error.message);
      }
    }

    async function checkUser() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      currentUser = user;
      const btn = document.getElementById('auth-btn');
      if (user && btn) {
        btn.innerText = "Logout (" + user.email.split('@')[0] + ")";
      } else if (btn) {
        btn.innerText = "Sign In";
      }
    }

    function refreshBackground() {
      const randomImg = bgImages[Math.floor(Math.random() * bgImages.length)];
      document.getElementById('dynamic-bg').src = randomImg + `&sig=${Math.random()}`;
    }

    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      document.getElementById(`page-${id}`).classList.remove('hidden');
      const isQ = id === 'quotes';
      document.getElementById('tab-quotes').className = isQ ? 'px-5 py-2 text-sm font-medium rounded-lg bg-brand text-white shadow-lg transition-all' : 'px-5 py-2 text-sm font-medium rounded-lg text-gray-400 hover:text-white transition-all';
      document.getElementById('tab-dashboard').className = !isQ ? 'px-5 py-2 text-sm font-medium rounded-lg bg-brand text-white shadow-lg transition-all' : 'px-5 py-2 text-sm font-medium rounded-lg text-gray-400 hover:text-white transition-all';
    }

    function renderDashboard() {
      document.getElementById('goal-items').innerHTML = goals.map((g, i) => `
        <div class="flex items-center gap-4 bg-dark p-4 rounded-2xl border border-white/5 hover:border-white/10 transition-all">
          <div onclick="toggleGoal(${i})" class="w-6 h-6 rounded-full border-2 cursor-pointer flex items-center justify-center flex-shrink-0 ${g.done ? 'bg-brand border-brand' : 'border-white/20'}">
            ${g.done ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold truncate ${g.done ? 'line-through text-gray-500' : 'text-gray-100'}">${g.name}</p>
            <div class="w-full bg-white/10 h-1 rounded-full mt-2 overflow-hidden">
              <div class="bg-brand h-full rounded-full transition-all duration-500" style="width:${g.done ? 100 : g.progress}%"></div>
            </div>
          </div>
        </div>`).join('');
      const doneCount = goals.filter(g => g.done).length;
      document.getElementById('goals-done').textContent = doneCount;
      document.getElementById('goals-active').textContent = goals.length - doneCount;
      document.getElementById('goals-pct').textContent = goals.length ? Math.round((doneCount / goals.length) * 100) + '%' : '0%';
      const bars = [40, 70, 45, 90, 65, 80, 20];
      document.getElementById('bar-chart').innerHTML = bars.map(h => `<div class="flex-1 bg-white/5 rounded-t-lg relative h-full"><div class="absolute bottom-0 w-full bg-solar rounded-t-sm" style="height:${h}%"></div></div>`).join('');
      document.getElementById('bar-days').innerHTML = ['M','T','W','T','F','S','S'].map(d => `<span class="text-[10px] font-bold text-gray-500 w-full text-center">${d}</span>`).join('');
    }

    function toggleGoal(i) { goals[i].done = !goals[i].done; renderDashboard(); }
    function openModal() { document.getElementById('modal').classList.replace('hidden', 'flex'); document.getElementById('goal-input').focus(); }
    function closeModal() { document.getElementById('modal').classList.replace('flex', 'hidden'); }
    function addGoal() {
      const val = document.getElementById('goal-input').value.trim();
      if(val) { goals.push({name: val, done: false, progress: 0}); renderDashboard(); closeModal(); document.getElementById('goal-input').value = ''; }
    }

    async function downloadQuoteImage() {
      const card = document.getElementById('quote-hero-card');
      const btn = document.getElementById('save-btn');
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span>Processing...</span>`;
      try {
        const canvas = await html2canvas(card, { useCORS: true, scale: 3, backgroundColor: '#000000', logging: false });
        const link = document.createElement('a');
        link.download = `motiv-${new Date().toISOString().slice(0,10)}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
        btn.innerHTML = `<span>Ready!</span>`;
      } catch (e) { console.error("Export failed:", e); btn.innerHTML = `<span>Error</span>`; }
      finally { setTimeout(() => { btn.innerHTML = originalHTML; btn.disabled = false; }, 2000); }
    }

    window.onload = init;
  </script>
</body>
</html>
